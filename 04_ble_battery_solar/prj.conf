# Nordic_Solar — Stage 4: BLE peripheral (battery + solar status)

# --- nPM1300 charger sensor ---
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_GPIO=y
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y

# --- Bluetooth LE peripheral ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# Appearance 1360 = Generic Sensor
CONFIG_BT_DEVICE_NAME="Nordic_Solar"
CONFIG_BT_DEVICE_APPEARANCE=1360
CONFIG_BT_MAX_CONN=1

# Standard Battery Service
CONFIG_BT_BAS=y

# --- Floating point (log formatting / SoC math) ---
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Console / logging over RTT ---
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n

# No 32.768 kHz crystal on this board (DK default is LFXO).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y
