# Nordic_Solar — Stage 1: LED blinky (nPM1300 LED0)

# nPM1300 core: MFD + I2C + LED driver
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_LED=y
CONFIG_LED_NPM13XX=y
CONFIG_GPIO=y

# Console / logging over RTT (no UART is broken out on this board)
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_SERIAL=n

# No 32.768 kHz crystal on this board (DK default is LFXO).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_NRF_GRTC_TIMER_SOURCE_LFLPRC=y
